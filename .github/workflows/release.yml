name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    name: Tag a version
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      # semantic-release reads the Conventional Commits since the last tag:
      #   fix: -> patch, feat: -> minor, "!" or a BREAKING CHANGE footer -> major.
      # When a release is due, this job bumps Cargo.toml and Cargo.lock, commits
      # the bump, tags vX.Y.Z, and opens a draft GitHub release. The draft is
      # published by the `publish` job once the binaries are attached.
      - name: release
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: npx --yes -p semantic-release@25 -p @semantic-release/exec@7 -p @semantic-release/git@10 semantic-release

  macos:
    name: macOS app (universal)
    runs-on: macos-latest
    needs: version
    if: needs.version.outputs.version != ''
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v${{ env.VERSION }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Build both architectures
        run: |
          cargo build --release --target aarch64-apple-darwin
          cargo build --release --target x86_64-apple-darwin
          mkdir -p target/universal
          lipo -create \
            target/aarch64-apple-darwin/release/jira-tickets \
            target/x86_64-apple-darwin/release/jira-tickets \
            -output target/universal/jira-tickets
      - name: Bundle the app
        run: CARGO=cargo BIN=target/universal/jira-tickets scripts/bundle-macos.sh --no-install
      - name: Package
        run: |
          ditto -c -k --keepParent "target/release/Jira Tickets.app" "Jira-Tickets-$VERSION-macos.zip"
          shasum -a 256 "Jira-Tickets-$VERSION-macos.zip" > "Jira-Tickets-$VERSION-macos.zip.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: Jira-Tickets-*

  linux:
    name: Linux binary (x86_64)
    runs-on: ubuntu-latest
    needs: version
    if: needs.version.outputs.version != ''
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v${{ env.VERSION }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release
      - name: Package
        run: |
          dir="jira-tickets-$VERSION-linux-x86_64"
          mkdir "$dir"
          cp target/release/jira-tickets README.md LICENSE "$dir/"
          tar -czf "$dir.tar.gz" "$dir"
          sha256sum "$dir.tar.gz" > "$dir.tar.gz.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: jira-tickets-*.tar.gz*

  publish:
    name: Publish the release
    runs-on: ubuntu-latest
    needs: [version, macos, linux]
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: v${{ needs.version.outputs.version }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Attach the files
        run: gh release upload "$TAG" Jira-Tickets-* jira-tickets-* --clobber -R "$GITHUB_REPOSITORY"
      - name: Publish
        run: gh release edit "$TAG" --draft=false --latest -R "$GITHUB_REPOSITORY"
